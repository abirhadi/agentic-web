<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventHub</title><style>body{font-family:system-ui;margin:0;padding:16px}main{max-width:1000px;margin:auto}input,select,button{max-width:100%;box-sizing:border-box}article{padding:12px;border:1px solid #aaa;margin:12px 0}form{display:grid;gap:8px}</style></head><body><main><h1>EventHub</h1><nav><a href="#events">Events</a></nav><p>Discover your community</p>
    <label>Search<input data-testid="event-search"></label><label>Category<select data-testid="category-filter"><option value="">All</option><option>Music</option><option>Art</option></select></label>
    <section id="events"></section><p role="status" data-testid="registration-feedback"></p>
    <form data-testid="add-event-form"><label>Title<input name="title" required></label><label>Date<input name="date" type="date" required></label><label>Location<input name="location" required></label><label>Category<select name="category"><option>Music</option><option>Art</option></select></label><button type="submit">Add event</button></form><footer>Contact the community</footer></main><script>const events=Array.from({length:6},(_,i)=>({title:i===0?'Community Music Night':'Gathering '+i,category:i%2?'Art':'Music',date:'2027-01-01',location:'Town Hall'}));
    const grid=document.querySelector('#events'),search=document.querySelector('[data-testid="event-search"]'),filter=document.querySelector('[data-testid="category-filter"]');
    function render(){grid.replaceChildren();events.filter(e=>e.title.toLowerCase().includes(search.value.toLowerCase())&&(!filter.value||e.category===filter.value)).forEach(e=>{const card=document.createElement('article');card.dataset.testid='event-card';card.dataset.category=e.category;const title=document.createElement('h2');title.textContent=e.title;const info=document.createElement('p');info.textContent=e.date+' '+e.location+' '+e.category;const b=document.createElement('button');b.dataset.testid='register-button';b.textContent='Register';b.onclick=()=>document.querySelector('[data-testid="registration-feedback"]').textContent='Registered for '+e.title;card.append(title,info,b);grid.append(card);});}
    search.oninput=render;filter.onchange=render;document.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);events.push(Object.fromEntries(f));e.target.reset();render();};render();</script></body></html>
