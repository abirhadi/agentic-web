<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracker</title><style>body{font-family:system-ui;margin:0;padding:16px}main{max-width:1000px;margin:auto}input,select,button{max-width:100%;box-sizing:border-box}article{padding:12px;border:1px solid #aaa;margin:12px 0}form{display:grid;gap:8px}</style></head><body><main><h1>Task Tracker</h1><form><label>Task title<input data-testid="task-title" required></label><button data-testid="add-task">Add task</button></form><section id="tasks"></section></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('[data-testid="task-title"]');const item=document.createElement('article');item.dataset.testid='task-item';const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.dataset.testid='complete-task';label.append(box,document.createTextNode(input.value));const del=document.createElement('button');del.dataset.testid='delete-task';del.textContent='Delete';del.onclick=()=>item.remove();item.append(label,del);document.querySelector('#tasks').append(item);input.value='';};</script></body></html>
