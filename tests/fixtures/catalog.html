<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Catalog</title><style>body{font-family:system-ui;margin:0;padding:16px}main{max-width:1000px;margin:auto}input,select,button{max-width:100%;box-sizing:border-box}article{padding:12px;border:1px solid #aaa;margin:12px 0}form{display:grid;gap:8px}</style></head><body><main><h1>Product Catalog</h1><label>Search<input data-testid="product-search"></label><label>Category<select data-testid="product-category"><option value="">All</option><option>Home</option><option>Tech</option></select></label><section id="products"></section></main><script>const products=[{name:'Harbor Mug',category:'Home',price:12},{name:'Linen Pillow',category:'Home',price:25},{name:'Desk Speaker',category:'Tech',price:40},{name:'Travel Mouse',category:'Tech',price:18}];const search=document.querySelector('[data-testid="product-search"]'),filter=document.querySelector('[data-testid="product-category"]');function render(){const grid=document.querySelector('#products');grid.replaceChildren();products.filter(p=>p.name.toLowerCase().includes(search.value.toLowerCase())&&(!filter.value||p.category===filter.value)).forEach(p=>{const card=document.createElement('article');card.dataset.testid='product-card';card.dataset.category=p.category;card.textContent=p.name+' '+p.category+' $'+p.price;grid.append(card);});}search.oninput=render;filter.onchange=render;render();</script></body></html>
